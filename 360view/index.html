<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>360° 共用環景</title><style>body{font:16px Arial,sans-serif;margin:0;padding:32px;background:#171d23;color:#fff}a{color:#f0c87b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}img{width:100%;aspect-ratio:2;object-fit:cover}article{background:#252c33;padding:16px;border-radius:8px}h1{font-size:28px}p{line-height:1.8}</style><h1>360° 共用環景</h1><p><a href="../index.html">返回展廳總覽</a>｜進入展廳後，在「共用 360° 環景」選單選用。圖片會在選用時載入。</p><div class="grid" id="list"></div><script>fetch('catalog.json').then(r=>{if(!r.ok)throw Error('清單讀不到');return r.json()}).then(d=>{for(const e of d.items){const a=document.createElement('article'),im=document.createElement('img'),h=document.createElement('h2'),link=document.createElement('a');im.src=e.thumbnail;im.loading='lazy';im.alt=e.name;h.textContent=e.name;link.href=e.file;link.textContent='開啟環景圖片';a.append(im,h,link);document.getElementById('list').append(a)}}).catch(e=>{document.getElementById('list').textContent=e.message})</script></html>
