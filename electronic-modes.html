<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電子藝術 · 三模式對照</title><link rel="stylesheet" href="electronic-modes.css"><script data-shared-gallery-ui defer src="shared/gallery-ui.js?v=home20"></script></head><body><header><a href="index.html">◇ CONTOUR GALLERY</a><nav><a href="opto-art-pool.html">共用 Pool</a><a href="viewer/generated-cross1/gallery.html?electronic=1">進入 Hex 展廳 →</a></nav></header><main><p class="eyebrow">ELECTRONIC ART · WALL DISPLAY</p><h1>讓作品直接映在牆上。</h1><p class="intro">同一件作品、相同時間點，比較三種顯示方式。透明無框為展廳預設。</p><div class="controls"><label for="work">選擇作品</label><select id="work" disabled></select><button id="pause" type="button" disabled>暫停</button><label for="wall">牆面</label><select id="wall"><option value="dark">工業灰</option><option value="light">純白</option></select></div><p id="status" role="status">正在讀取作品…</p><div class="grid"><section><div class="wall"><canvas id="transparent" width="320" height="283" aria-label="透明無框動畫"></canvas></div><div class="caption"><span class="badge">預設</span><h2>透明無框</h2><p>只有彩色結構，牆面從空隙透出。</p></div></section><section><div class="wall"><canvas id="round" width="320" height="283" aria-label="圓形黑底動畫"></canvas></div><div class="caption"><h2>圓形黑底</h2><p>結構完整縮入黑色圓盤，外圍透明。</p></div></section><section><div class="wall"><canvas id="framed" width="320" height="283" aria-label="方框黑底動畫"></canvas></div><div class="caption"><h2>方框黑底</h2><p>黑色矩形底板與外框，呈現螢幕效果。</p></div></section></div><div class="note"><p>進入展廳後，打開右側「電子藝術 · 顯示模式」，可調整目前作品或全部作品，並設定發光強度。</p><p>此瀏覽器會記住你的選擇。在工作台保存預設值後，輸出展廳也會保留顯示設定。</p><a class="action" href="viewer/generated-cross1/gallery.html?electronic=1">進入已掛畫的 Hex 展廳 →</a></div></main><script src="shared/electronic-animation.js"></script><script src="electronic-modes.js"></script></body></html>
